name: CI-CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Линтер
        run: flake8 .
      - name: Тесты
        run: pytest -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Выкладка на прод
        run: |
          mkdir -p $HOME/xxx-app
          cp xxx.py $HOME/xxx-app/